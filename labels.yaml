# 整份日報層級的排除（不只是標題髒，是整批資料不能用）
exclude:
  # 未來日期一律排除。實測出現過 2082-05-21 / 2085-04-20 / 2092-09-13 / 2094-01-05，
  # 一個一個硬編追不上——新的冒出來到有人發現之間，統計已經被污染了。
  future_dates: true
  # 日期合法但整份不能用的（future_dates 蓋不到的才寫這裡）
  dates: []
  # 未定稿日報。DRAFT 可被改寫或刪除，title 還會變 → 標籤會漂。
  # 但實測開了會從 450 張掉到 409（-9%），現階段資料太少，先不開。
  # status: [DRAFT]
  # 測試工地。PMS dev 留著的假工地（api.py 註：dev 另存 7/23 起 81 張，
  # 含 Project A、發大財 這種測試資料）。現在的 4 張靠 HOHOHO junk + title 空
  # 偶然接住，但那是標題層級的保護——哪天有人在這裡發一篇正常標題的日報就會
  # 混進訓練集。黑名單掛在工地層級才擋得住。legacy manifest 沒這兩個工地。
  sites:
    - Project A
    - 發大財
  # 測試帳號（createdBy = account uuid）。系統才上線 20 幾天，資料太少，
  # 開這個過濾會砍掉 56% 與四個類別，故暫時停用；資料量夠了再打開。
  createdBy: []
    # - c98f2ca6-3c18-4606-9171-99c6ff0ddfc3   # 11409001 許雅姿

# 直接排除（測試資料、無語意標題）
junk:
  - TEST
  - HOHOHO
  - WI-1
  - WI-2
  - 江董視察交辦事項
  # v15（2026-09-19，看圖複核）：消防檢驗/檢查 12 張你逐格判「不是施工照」——
  # 畫面是查驗活動不是施工畫面，與「自主查驗」同性質（Jev 也獨立判非施工）。
  # 注意這兩條**只擋純查驗標題**：消防水箱打底/貼磚是實際泥作施工，
  # 已由上面的 `消防水箱` 規則接走，不受這裡影響。
  - 消防檢驗
  - 消防檢查
min_title_length: 3
# 整串沒有半個中文字 = 只有樓層/編號，沒有工項語意（SPEC §5.3 的「13F~7F」）
junk_patterns:
  - "^[^\\u4e00-\\u9fff]+$"
  # 舊 pptx 帶進來的非工項投影片：拍的是查驗表單、人數、驗收文件，不是施工畫面。
  # 實測 455 種 fallback 標題裡這幾類佔前段（自主查驗 88 張、人數清點 19、消毒 8）。
  # 消防檢查／消防檢驗（12 張）：實際看過照片是**撒水頭放水測試**——一群人圍著看
  # 天花板噴水，跟上面那幾種一樣是查驗活動，不是施工畫面。
  # 不是「機電-消防」：那要拍消防管線施作才算。
  - "自主查驗|人數清點|工地消毒|雨汙水驗收|放樣|進度|會勘|勘驗|消防檢"

# 命名規約：`工種-施作內容`
#
#   工種   取工程分類樹上最貼切的那一支（多半是中類，樹上沒有中類的用大類）。
#          泥作那幾類（打底/粉光/地磚貼飾/壁磚貼飾/外牆磁磚）同屬「裝修工程 >
#          泥作工程」，前綴一致才看得出它們是兄弟——
#          舊名「泥作 / 磁磚_地 / 磁磚_牆」讓貼磚看起來像泥作以外的東西。
#   施作內容 取**現場 title 的慣用語**，不用材料名、不編樹上與資料裡都沒有的詞。
#          工種本身已經唯一、沒有要區分的細項時就不加後綴（例：石材）。
#          輕隔間曾是這種例子，v7 因為 QS0512/QS0406 兩份標準工序不同而拆開，
#          後綴改用工法名（灌漿牆／輕質磚），不是「施作內容」的慣用語，是特例。
#
# 由上而下，第一個命中者勝 —— 順序即優先權
rules:
  # 類名不用「止漏」：那是漏水後的補救，這 20 張是工人在做防水層，兩回事。
  # 規則仍收「止漏」——Gemini 偶爾這樣寫，不收等於白扣它分。
  #
  # ⚠ `(?<!消)防水`：**「消防水箱」含有「防水」這個子字串**（消-防水-箱），
  #   v15 之前 6 張消防水箱打底/貼磚/抹縫被這條吃成 防水-防水施作，存在多版沒人發現。
  #   同 v15「補土 ≠ 批土」、v12「木門框被鋁門窗的門框搶走」：中文子字串誤命中
  #   是這份規則檔的系統性風險，不是偶發。
  #   計價樹把消防水箱歸在 `裝修工程>泥作工程>消防水消打底貼二級磚` —— 是**泥作**，
  #   不是防水、也不是機電消防（那支在 `機電工程>消防工程`，全是配管配線）。
  #   用負向後行而不是另開規則，是為了不讓新 label 提前出現、破壞 v8 的順序契約
  #   （test_order_specific_before_general 用 label 第一次出現的位置判先後）。
  #   排除後它自然落到下面既有的 打底 / 壁磚貼飾 規則，動作對應畫面。
  - { pattern: "(?<!消)防水|止漏", label: 防水-防水施作 }
  # QS0403 OPTIONAL 節點就是外牆/內牆兩支，工序位置不同（外牆吊料/施工架，
  # 內牆浴室防水搭接），拆開才對得上分類樹（v8）。「外牆磁磚」必須排在前面，
  # 否則被下面那條的「壁磚」子字串接走，外牆永遠拆不出來。
  # 「外牆貼磁磚」是 Gemini 的慣用寫法，人寫的是「外牆磁磚」；少這一條會冤枉基準線
  - { pattern: "外牆磁磚|外牆貼磚|外牆貼磁磚|外部磁磚|外部牆面貼飾|外牆基座磁磚", label: 泥作-外牆磁磚 }
  # 現場「壁磚」實測全是浴室/門廳等室內位置（9F/10F浴室壁磚貼飾、小門廳壁磚貼飾）
  - { pattern: "壁磚|補磚", label: 泥作-壁磚貼飾 }
  # `道磚`（人行道磚、車道磚）與 `店鋪地`（店鋪地平/地坪 60*60 磁磚）都是地坪貼磚，
  # 舊規則只認「地磚」二字，這兩種寫法整批落到 fallback（make newclass 挖出來的）。
  # 不能直接加「地坪」——它排在耐磨地坪規則前面，會把 EPOXY 地坪整批搶走。
