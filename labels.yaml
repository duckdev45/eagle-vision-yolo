version: 10   # yaml 自己的計數器（reports/ 的 v4/v5/v6 是實驗編號，兩者無關）
# v10（2026-09-03）：「烤漆玻璃」「明鏡」改歸 門窗-玻璃，翻掉舊判（原本歸油漆）。
#   舊判依據是工程分類樹（請款用），這次拿真實照片的人工查驗重點（chipsOn）逐字
#   對過 QS0606 玻璃工程查驗表 item2/5/7（進料破損/尺寸規格/矽利康接觸面），
#   確認是玻璃安裝的查驗項不是油漆的——4 張真實照片全部符合，沒有例外案例。
# v9（2026-09-02）：拆「泥作-打底粉光」為打底/粉光——QS0402 SOP 明文兩個不同
#   階段（打底是粗底層、粉光是完成面，打底完成經工務所查驗合格才可施作粉光），
#   跟輕隔間/壁磚同一種「一個 label 混兩份工序階段」問題。文字上乾淨可分（156
#   張裡 110 張打底 vs 30 張粉光，沒有同時出現兩詞的歧義標題），不用問專案。
#   「泥作缺失改善」「吊線」等無法判斷階段的殘餘，跟 v7 輕隔間同邏輯預設歸
#   大宗那邊（打底），不強猜。
# v8（2026-09-02）：拆「泥作-壁磚貼飾」為外牆/內牆——QS0403 OPTIONAL 節點就是
#   這兩支，工序位置不同。實測「壁磚」全是浴室/門廳室內位置（46 張外牆磁磚 vs
#   22 張室內壁磚），文字上乾淨可分，不像輕隔間那批有歧義，不用問專案。
# v7（2026-09-02）：拆「輕隔間」為兩類——QS0512 輕質灌漿牆 ≠ QS0406 輕質磚，
#   工序形狀完全不同，合併是結構性錯誤（ROADMAP ③ 已定案）。專案內問過：
#   現場全是灌漿牆、輕質磚已少用，但標準要留著——所以「輕質磚」關鍵字獨立
#   一條（目前 0 張，張數夠了 min_class_size 自動放行，同機械停車/欄杆鐵件的
#   先例），其餘「輕隔間」字樣（擊釘/施作/組立/灌漿）預設歸灌漿牆，不強猜。
# v6（2026-08-25）：`make newclass` 從 895 張沒人認領的照片裡挖出來的。
#   擴充既有規則：廚具+廚櫃/櫥櫃、植栽+植裁（錯字）、地磚+道磚/店鋪地
#   新增 5 類：防水-嵌縫、門窗-淋浴拉門、門窗-住戶大門、假設-鷹架、公共-路緣石
#   排除：消防檢查（看過照片，是撒水頭放水測試，屬查驗）
#   **沒有**收的：`1F大廳公設裝修施作` 63 張。抽 4 張看：木作造型、藝術漆牆面、
#   完成面、木作櫃體+石材天花——一個 title 蓋整個大廳跨工種，開成一類等於把
#   「其他」改個名字。那 63 張要靠照片層級的複核裁決拆，規則拆不動。
# v5：類別全面改名為 `工種-施作內容`。分類邏輯與張數完全沒動，只有名字換了，
#     但 reports/ 裡 v4 之前的每份結果都對不上這套名字，別拿去混著比。

# 整份日報層級的排除（不只是標題髒，是整批資料不能用）
exclude:
  # 未來日期一律排除。實測出現過 2082-05-21 / 2085-04-20 / 2092-09-13 / 2094-01-05，
  # 一個一個硬編追不上——新的冒出來到有人發現之間，統計已經被污染了。
  future_dates: true
  # 日期合法但整份不能用的（future_dates 蓋不到的才寫這裡）
  dates: []
  # 未定稿日報。DRAFT 可被改寫或刪除，title 還會變 → 標籤會漂。
  # 但實測開了會從 450 張掉到 409（-9%），現階段資料太少，先不開。
  # status: [DRAFT]
  # 測試帳號（createdBy = account uuid）。系統才上線 20 幾天，資料太少，
  # 開這個過濾會砍掉 56% 與四個類別，故暫時停用；資料量夠了再打開。
  createdBy: []
    # - c98f2ca6-3c18-4606-9171-99c6ff0ddfc3   # 11409001 許雅姿

# 直接排除（測試資料、無語意標題）
junk:
  - TEST
  - HOHOHO
  - WI-1
  - WI-2
  - 江董視察交辦事項
min_title_length: 3
# 整串沒有半個中文字 = 只有樓層/編號，沒有工項語意（SPEC §5.3 的「13F~7F」）
junk_patterns:
  - "^[^\\u4e00-\\u9fff]+$"
  # 舊 pptx 帶進來的非工項投影片：拍的是查驗表單、人數、驗收文件，不是施工畫面。
  # 實測 455 種 fallback 標題裡這幾類佔前段（自主查驗 88 張、人數清點 19、消毒 8）。
  # 消防檢查／消防檢驗（12 張）：實際看過照片是**撒水頭放水測試**——一群人圍著看
  # 天花板噴水，跟上面那幾種一樣是查驗活動，不是施工畫面。
  # 不是「機電-消防」：那要拍消防管線施作才算。
  - "自主查驗|人數清點|工地消毒|雨汙水驗收|放樣|進度|會勘|勘驗|消防檢"

# 命名規約：`工種-施作內容`
#
#   工種   取工程分類樹上最貼切的那一支（多半是中類，樹上沒有中類的用大類）。
#          泥作那幾類（打底/粉光/地磚貼飾/壁磚貼飾/外牆磁磚）同屬「裝修工程 >
#          泥作工程」，前綴一致才看得出它們是兄弟——
#          舊名「泥作 / 磁磚_地 / 磁磚_牆」讓貼磚看起來像泥作以外的東西。
#   施作內容 取**現場 title 的慣用語**，不用材料名、不編樹上與資料裡都沒有的詞。
#          工種本身已經唯一、沒有要區分的細項時就不加後綴（例：石材）。
#          輕隔間曾是這種例子，v7 因為 QS0512/QS0406 兩份標準工序不同而拆開，
#          後綴改用工法名（灌漿牆／輕質磚），不是「施作內容」的慣用語，是特例。
#
# 由上而下，第一個命中者勝 —— 順序即優先權
rules:
  # 類名不用「止漏」：那是漏水後的補救，這 20 張是工人在做防水層，兩回事。
  # 規則仍收「止漏」——Gemini 偶爾這樣寫，不收等於白扣它分。
  - { pattern: "防水|止漏", label: 防水-防水施作 }
  # QS0403 OPTIONAL 節點就是外牆/內牆兩支，工序位置不同（外牆吊料/施工架，
  # 內牆浴室防水搭接），拆開才對得上分類樹（v8）。「外牆磁磚」必須排在前面，
  # 否則被下面那條的「壁磚」子字串接走，外牆永遠拆不出來。
  # 「外牆貼磁磚」是 Gemini 的慣用寫法，人寫的是「外牆磁磚」；少這一條會冤枉基準線
  - { pattern: "外牆磁磚|外牆貼磚|外牆貼磁磚|外部磁磚", label: 泥作-外牆磁磚 }
  # 現場「壁磚」實測全是浴室/門廳等室內位置（9F/10F浴室壁磚貼飾、小門廳壁磚貼飾）
  - { pattern: "壁磚|補磚", label: 泥作-壁磚貼飾 }
  # `道磚`（人行道磚、車道磚）與 `店鋪地`（店鋪地平/地坪 60*60 磁磚）都是地坪貼磚，
  # 舊規則只認「地磚」二字，這兩種寫法整批落到 fallback（make newclass 挖出來的）。
  # 不能直接加「地坪」——它排在耐磨地坪規則前面，會把 EPOXY 地坪整批搶走。
  - { pattern: "地磚|道磚|店鋪地", label: 泥作-地磚貼飾 }
  # 踢腳：工程分類樹只有「室內踢腳油漆(含樓梯間踢腳)」一支，掛在油漆工程
  # 車道線/引導線：樹上是「油漆工程 > 地下室牆刷引導線」
  # 必須排在輕隔間前面：「15F輕隔間批土」照片上就是批土，與油漆批土同一種畫面。
  # 排在後面會把 14/20 張批土照掛成輕隔間，模型只能亂猜（實測該類 precision 0.45）。
  # 「烤漆玻璃」「明鏡」必須排在油漆前面：舊版判「烤漆玻璃仍歸油漆」是查另一份
  # 工程分類樹（請款用，非 QS），QS0606 玻璃工程查驗表出來後翻案——真實照片
  # 人手填的查驗重點逐字對上 QS0606 item2/5/7（進料破損斑點/尺寸規格/矽利康
  # 接觸面），是玻璃安裝的查驗項不是油漆的，v10 改歸玻璃（見版本註記）
  - { pattern: "烤漆玻璃|明鏡", label: 門窗-玻璃 }
  # `面漆` 是舊 pptx 的慣用詞（人寫「漆面」、舊報表寫「面漆」），漏了就掉進 fallback
  - { pattern: "油漆|批土|底漆|藝術漆|漆面|面漆|烤漆|踢腳|車道線|引導線", label: 油漆-批土塗裝 }
  # 樹上「裝修工程 > 室內隔間工程」底下 QS0512（灌漿牆）與 QS0406（輕質磚）
  # 是兩支不同標準、工序形狀不同，不能合併（v7 拆分，見上方版本註記）。
  # 「輕質磚」必須排在灌漿牆前面，否則永遠吃不到——關鍵字獨立自成一類。
  - { pattern: "輕質磚", label: 輕隔間-輕質磚 }
  # 專案現場全是灌漿牆，「輕隔間」其餘寫法（擊釘/施作/組立/灌漿）預設歸這類，
  # 不強猜工法。扣掉批土後剩 14 張，會被 min_class_size 砍掉——這是誠實的結果：
  # 真正拍到輕隔間骨架的照片就是不夠，不是模型學不會
  - { pattern: "輕隔間", label: 輕隔間-灌漿牆 }
  # 工程分類樹確認「打底」19 節點全在泥作工程、「批土」4 節點全在油漆工程 → 維持分兩類
  # QS0402 SOP 明文：打底完成經工務所查驗合格，才可施作面層粉光——兩個不同階段，
  # 「粉刷」是 2026-08-17 新 prompt 的慣用詞（人寫「粉光」），漏了會白扣 Gemini 分
  - { pattern: "粉光|粉刷", label: 泥作-粉光 }
  # 「泥作」「抹灰」「砌」「吊線」「缺失改善」等判不出階段的殘餘，預設歸打底（大宗），
  # 不強猜——同 v7 輕隔間邏輯
  - { pattern: "打底|泥作|抹灰|砌|吊線", label: 泥作-打底 }
  # 以下三類是舊 pptx 帶進來才夠張數的。分類樹都查得到，不是我們自己編的：
  #   石材   → 裝修工程 > 石材工程（外牆貼石材、大廳石材、公設石材…自成一支）
  #   耐磨地坪 → 裝修工程 > 整體粉光類 > 地下室耐磨地坪。EPOXY 同一種施作，寫法沒統一
  #   廚具   → 裝修工程 > 廚具設備
  - { pattern: "石材", label: 裝修-石材 }
  - { pattern: "耐磨地坪|EPOXY|EPOX|環氧", label: 裝修-耐磨地坪 }
  # 現場寫「廚櫃安裝」「櫥櫃安裝」的比寫「廚具」的多（46 張 vs 原本命中的那些），
  # 樹上同屬「裝修工程 > 廚具設備」，同一件事的三種寫法
  - { pattern: "廚具|廚櫃|櫥櫃", label: 裝修-廚具 }
  - { pattern: "木作|天花|封板", label: 木作-天花封板 }
  # 工程分類樹：矽利康自成一支（防水隔熱工程 > 矽利康工程），不屬門窗
  - { pattern: "矽利康", label: 防水-矽利康 }
  # 樹上「防水隔熱工程 > 嵌縫工程」自成一支（鋁門窗框嵌水泥砂漿縫）。現場寫「崁縫」，
  # 兩種寫法都收。必須排在鋁門窗之前——「12F窗框崁縫」被鋁門窗那條的 `門框` 接走的話，
  # 嵌縫就永遠不會有自己的類別。
  - { pattern: "崁縫|嵌縫", label: 防水-嵌縫 }
  - { pattern: "鋁門窗|門框", label: 門窗-鋁門窗 }
  # 門窗工程 > 淋浴拉門（樹上自成一支）。legacy 那 47 張全是淋浴拉門，
  # 不寫死「淋浴」是因為現場也寫「拉門安裝／拉門施作」
  - { pattern: "拉門", label: 門窗-淋浴拉門 }
  # 門窗工程 > 硫化銅門、防火門工程 > 住戶防火大門。收「住戶大門」「各戶大門」兩種寫法。
  # **必須排在雜項-缺失改善之前**：那 21 張裡有 11 張是「住戶大門門檻修改」，
  # 缺失那條收 `修繕`，字不同僥倖沒撞，但下次有人寫「大門修繕」就會被搶走。
  - { pattern: "戶大門", label: 門窗-住戶大門 }
  # 假設工程 > 鷹架工程
  - { pattern: "鷹架", label: 假設-鷹架 }
  # 樹上沒有緣石（它不是獨立請款項目），掛大類「公共及週邊工程」。
  # 排在石材之後：「沿街步道緣石抿石子」的施作面是抿石子，但拍的主體是緣石收邊。
  - { pattern: "緣石", label: 公共-路緣石 }
  # 工程分類樹：雜項工程 > 保護工程（裝修保護-地板/排水孔/門窗類），與清潔是兩回事
  - { pattern: "保護", label: 雜項-成品保護 }
  # 景觀必須排在清潔前面：「中庭植栽整理」的「整理」會被清潔規則先吃掉（14 張），
  # Gemini 判它景觀是對的，錯的是我們的規則順序
  # 喬木/覆土/填土/園藝/導水板都是同一支（植栽工程），舊 pptx 這幾種寫法都有
  # `植裁` 是「植栽」的錯字，現場寫了 13 張（空中花園植裁）。一個字之差整批接不到，
  # 這種錯字只能靠 make newclass 從沒人認領的標題裡撈出來。
  - { pattern: "植栽|植裁|景觀|園藝|喬木|覆土|填土|花台|導水板", label: 植栽-景觀 }
  # 鋼筋/模板要排在清潔前面：「鋼筋加工場場地整理」10 張畫面全是鋼筋，
  # 被「整理」吃進清潔，同時毒化清潔（f1 0.25）與鋼筋兩類
  - { pattern: "鋼筋", label: 結構-鋼筋 }
  - { pattern: "模板", label: 結構-模板 }
  # 清潔樹上查無（只有「工程材料 > 清潔劑」，那是材料不是施作）→ 掛雜項工程
  - { pattern: "清潔|整理|垃圾|清淤|清運", label: 雜項-清潔 }
  # 樹上「電梯及停車設備」底下是兩個中類：電梯 / 機械停車設備。命名規約說工種取
  # **中類**，所以分成兩類，不併成大類——併起來的話這個類別就成了「電梯與停車場的
  # 混合袋」，兩者畫面毫無共通點。
  # 機械停車排前面：「電梯式機械停車設備」兩個詞都有，那是停車設備不是電梯。
  # 全庫目前 0 張（規則先寫著，張數夠了 min_class_size 會自動放行，同金屬-欄杆鐵件）。
  - { pattern: "機械停車|停車塔|昇降機車位", label: 設備-機械停車 }
  - { pattern: "電梯", label: 設備-電梯 }
  # 「桩」是簡體，Gemini 會這樣輸出；規則只寫「樁」等於白扣它分。
  # 26 張全是舊基礎切削與連續壁（樹上「基礎工程 > 連續壁工程」），沒有樁。
  - { pattern: "切削|連續壁|基礎|樁|桩", label: 基礎-連續壁 }
  # 缺失改善樹上查無（它是跨工種的返工，不是請款項目）→ 掛雜項工程
  - { pattern: "美容|缺改|缺失|修繕", label: 雜項-缺失改善 }
  # 以下三類是把「其他」拆開的結果，張數還不夠（見 small_class），但規則先寫著
  - { pattern: "欄杆|鐵件", label: 金屬-欄杆鐵件 }    # 金屬構件 > 陽台欄杆
  - { pattern: "玻璃|黑鏡", label: 門窗-玻璃 }        # 門窗工程 > 玻璃工程；烤漆玻璃/明鏡已於 v10 移到油漆規則前面單獨判定
  - { pattern: "防撞|車輪檔|軟墊", label: 雜項-停車防護 }  # 雜項工程 > 地下室停車設施

# 沒有工種可言，不套命名規約
fallback: 其他
# 落到 fallback 的一律排除，不管張數。舊 pptx 進來之前「其他」自然低於門檻被 drop，
# 現在它有 1140 張、455 種互不相干的標題（大廳公設裝修、雨遮、放樣…），
# 留著就是教模型「其他 = 一袋雜物」——正是 README〈拆掉其他〉那一節說不要做的事。
# 想撿回某一類就加規則，不是讓它們躺在 fallback 裡。
drop_fallback: true
min_class_size: 12
# 不足 min_class_size 的類別怎麼辦：
#   drop  = 整批排除（預設）。防水-矽利康、雜項-成品保護這種「規則正確但張數還不夠」
#           的類，倒進「其他」等於教模型「其他 = 矽利康+保護+電梯+欄杆」，
#           把最爛的一類餵得更雜。實測 top-1 0.760，merge 只有 0.699。
#   merge = 併入 fallback（舊行為）
small_class: drop
