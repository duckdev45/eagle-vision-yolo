  - { pattern: "清潔|清理|整理|垃圾|清淤", label: 雜項-清潔 }
  # v15（2026-09-19 依 QS 樹）：土方是獨立一支，不掛連續壁、也不掛雜項清潔。
  #   查驗樹 QS0207 開挖工程標準（工序：開挖前準備→開挖/運棄）、
  #   QS0203 連續壁工程標準只到「整地/導溝」為止，**沒有土方開挖或運棄**；
  #   計價樹 `基礎工程>土方工程>土方挖運` 與 `>連續壁工程` 同層平行。
  #   → `土方清運` 歸開挖工程，不歸連續壁（兩棵樹都平行）、
  #   也不歸雜項-清潔（舊規則的 `清運` 把它吃掉，20 張歸錯，v15 修正）。
  #   全庫 22 張（土方清運 20 + 棄土坑施作 2）< min_class_size=12 與 40 門檻，
  #   **本輪退出訓練**——規則先寫著等張數，不倒進「其他」（同 v13 連續壁先例）。
  - { pattern: "土方|開挖|運棄|棄土", label: 基礎-開挖工程 }
  # 樹上「電梯及停車設備」底下是兩個中類：電梯 / 機械停車設備。命名規約說工種取
  # **中類**，所以分成兩類，不併成大類——併起來的話這個類別就成了「電梯與停車場的
  # 混合袋」，兩者畫面毫無共通點。
  # 機械停車排前面：「電梯式機械停車設備」兩個詞都有，那是停車設備不是電梯。
  # 全庫目前 0 張（規則先寫著，張數夠了 min_class_size 會自動放行，同金屬-欄杆鐵件）。
  - { pattern: "機械停車|停車塔|昇降機車位", label: 設備-機械停車 }
  - { pattern: "電梯", label: 設備-電梯 }
  # 「桩」是簡體，Gemini 會這樣輸出；規則只寫「樁」等於白扣它分。
  # v13（2026-09-05 依現場指示正名）：切削從連續壁拆出——「舊基礎切削作業/施作圖」
  # 是全迴轉切削機打除舊基礎的工項（日報 48 張），跟連續壁（壁體施作）畫面與工序
  # 都不同，長年混在一條規則裡。命名照現場慣用語（同「防水-防水施作」前例）。
  # 副作用照實記錄：日報源連續壁只剩 3 張（機具進場，其一經看圖仲裁改歸清潔），
  # 不足 min_class_size=12，本輪訓練連續壁整類退出（legacy ~54 張因 topup 只補
  # PMS 已有的類，救不回來）——48 張切削有自己的類之後，這是誠實的結果。
  - { pattern: "切削", label: 基礎-舊基礎切削 }
  - { pattern: "連續壁|基礎|樁|桩", label: 基礎-連續壁 }
  # 缺失改善樹上查無（它是跨工種的返工，不是請款項目）→ 掛雜項工程
  # v17（2026-09-28）：缺失改善跟工種**正交**——「是不是缺改」改由獨立的缺失旗標表達
  #   （core/pms_review.defect_flags：標題缺失字＋defect-probe 圖像分數，人工可改），
  #   工種照 QS 計價歸屬。查核依據：QS 標準總表 76 份標準、1,229 檢查項沒有任何一份
  #   「缺失改善」標準（唯一提到缺改的是 QS0512-11 灌漿牆 7 天空心查驗，屬灌漿牆本身）；
  #   billing_items.json 489 節點、雜項工程底下只有停車設施／保護工程／複壁檢修口／
  #   樓層標示／刮泥墊／停車標示牌，沒有缺失改善；QS1002 是公共設施（排水溝／柏油）修護，
  #   不是跨工種返工。所以：
  #   - 標題**看得出工種**的缺改歸該工種（油漆／地磚／壁磚／鋁門窗…既有規則本來就在前面）。
  #     本版補玻璃：「室內玻璃缺失改善」「玻璃缺改」→ 門窗-玻璃（QS0606），原本被下面那條
  #     接走，因為通用玻璃規則排在更後面。
  #   - **看不出工種**的（泥作缺失改善、輕隔間初驗缺改、儀邱／公設／兒童遊戲室缺失改善、
  #     磁磚美容）才留在 雜項-缺失改善，並列入人工看圖清單——它是「待定工種」的暫存類，
  #     不是一個計價項目。
  - { pattern: "^(?=.*玻璃)(?=.*(缺失|缺改|美容|修繕))", label: 門窗-玻璃 }
  - { pattern: "美容|缺改|缺失|修繕", label: 雜項-缺失改善 }
  # v15（2026-09-19 依 QS 樹章節結構 + 看圖複核 orphan-review-decisions.json）：
  #   「扶手」在 QS 樹上不是一支，而是依位置散在五個大項底下——
  #   裝修工程>櫸木扶手 / 假設工程>安全衛生設施>樓梯臨時扶手及拆除 /
  #   鷹架工程>上下梯桿（含扶手）/ 假設工程>扶手先行工法 / 金屬構件>驗收用扶手。
  #   所以**只收裝修工程底下那支**：櫸木扶手本體施作（13 張，剛過 min_class_size）。
  #   看圖複核確認這 13 張主體是扶手木作本身（非漆面、非缺改——那兩批依既有規則
  #   分走雜項-缺失改善 24 張與油漆-批土塗裝 17 張，跨工種返工的歸屬不變）。
  #   「店舖扶手裝設」2 張畫面是金屬欄杆（QS: 金屬構件>驗收用扶手），歸欄杆鐵件。
  #   必須排在缺失改善與油漆之後：木扶手油漆/木扶手缺失改善的動詞是漆/修，
  #   與 v12 木門規則同邏輯（框扇組立收進來，油漆留在批土塗裝）。
  - { pattern: "櫸木扶手", label: 裝修-櫸木扶手 }
  # v15：格柵在 QS 樹上同樣不是一支，依位置分散：
  #   門窗工程>鋁門窗工程（含冷氣隔柵）>冷氣格柵 → 鋁門窗（4 張，看圖確認是
  #     冷氣外部百葉格柵，與鋁門窗同班組同計價）
  #   金屬構件>陽台格柵（含外牆及夾層格柵）→ 欄杆鐵件（8 張：陽台防墜/機房/9F以下）
  #   木作平頂工程>天花格柵 → 天花封板（5 張，原本「天花」那條已接住，本次補註解）
  #   冷氣格柵這條必須排在鋁門窗之後（否則「冷氣格柵安裝」會被它自己搶走，
  #   歸屬仍然是鋁門窗，但註解要說明為何不加 pattern——下面那條已涵蓋）。
  - { pattern: "欄杆|鐵件|格柵|店舖扶手", label: 金屬-欄杆鐵件 }
  #   ^ v15 加 `格柵`：排除掉冷氣與天花板格柵後，剩下的陽台/機房/防墜格柵
  #     依 QS 歸金屬構件。靠**規則順序**做到分流的：天花在前面（183 行），
  #     冷氣不加 pattern（鋁門窗那條的 `門窗` 接不住「冷氣格柵」，所以這裡
  #     明確不收——冷氣格柵 fallback 進來時請回頭看 v15 註解）。
  # 以下三類是把「其他」拆開的結果，張數還不夠（見 small_class），但規則先寫著
  - { pattern: "玻璃|黑鏡", label: 門窗-玻璃 }        # 門窗工程 > 玻璃工程；烤漆玻璃/明鏡已於 v10 移到油漆規則前面單獨判定
  - { pattern: "防撞|車輛檔|軟墊", label: 雜項-停車防護 }  # 雜項工程 > 地下室停車設施

# 沒有工種可言，不套命名規約
fallback: 其他
# 落到 fallback 的一律排除，不管張數。舊 pptx 進來之前「其他」自然低於門檻被 drop，
# 現在它有 1140 張、455 種互不相干的標題（大廳公設裝修、雨遮、放樣…），
# 留著就是教模型「其他 = 一袋雜物」——正是 README〈拆掉其他〉那一節說不要做的事。
# 想撿回某一類就加規則，不是讓它們躺在 fallback 裡。
drop_fallback: true
min_class_size: 12
# 不足 min_class_size 的類別怎麼辦：
#   drop  = 整批排除（預設）。防水-矽利康、雜項-成品保護這種「規則正確但張數還不夠」
#           的類，倒進「其他」等於教模型「其他 = 矽利康+保護+電梯+欄杆」，
#           把最爛的一類餵得更雜。實測 top-1 0.760，merge 只有 0.699。
#   merge = 併入 fallback（舊行為）
small_class: drop
