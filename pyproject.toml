[project]
name = "eagle-vision"
version = "0.1.0"
description = "工項辨識資料集與模型"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "python-dotenv>=1",
    "httpx>=0.27",
    "streamlit>=1.38",
    # 舊版日報是 pptx（888 份 / 3.9GB），legacy.py 靠它抽標題與照片
    "python-pptx>=1.0",
    # 複核佇列要用滑鼠拖框標「證據在哪」。零依賴的替代方案（格子勾選、範圍滑桿）
    # 只標得出方格或單一矩形，標不了「這張有兩處證據、其中一處是斜的」——
    # 而框的用途是餵訓練，標得不準等於餵髒資料，這個依賴省不得。
    "streamlit-drawable-canvas>=0.9",
]

[project.optional-dependencies]
# 只有訓練需要，先跑 sync/organize 的人不必裝
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=2.26",
    "timm>=1.0",
    "onnxscript>=0.7.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
]

[tool.uv]
package = false
