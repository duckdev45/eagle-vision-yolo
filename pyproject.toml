[project]
name = "eagle-vision"
version = "0.1.0"
description = "工項辨識資料集與模型"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "python-dotenv>=1",
    "httpx>=0.27",
    "streamlit>=1.38",
    # 複核佇列要用滑鼠拖框標「證據在哪」。零依賴的替代方案（格子勾選、範圍滑桿）
    # 只標得出方格或單一矩形，標不了「這張有兩處證據、其中一處是斜的」——
    # 而框的用途是餵訓練，標得不準等於餵髒資料，這個依賴省不得。
    "streamlit-drawable-canvas>=0.9",
    "pandas-stubs~=3.0.5",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# 只有訓練需要，先跑 sync/organize 的人不必裝
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=2.26",
    "timm>=1.0",
    "ultralytics>=8.4.138",
]
# 開發：lint + format（Ruff 一件取代 flake8+isort+black）
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 專案以 editable 安裝進 .venv：hatchling 寫一個 .pth 把 repo 根目錄與 src/ 放上 sys.path，
# `import paths`／`from core import ...` 在任何入口（uv run 腳本、streamlit、pytest、python -c）都找得到，
# 各檔不必再自己 sys.path.insert（以前 55 支檔案、85 行）。只在本機用，不發佈 wheel。
[tool.hatch.build]
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["core", "pipeline"]

[tool.uv]
package = true

# ── Ruff：lint + format 統一配置 ─────────────────────────────────────
[tool.ruff]
line-length = 110                     # 既有慣例：>110 只有 178 行（多為表格註解），>100 有 455 行
src = [".", "src"]                    # 根目錄套件（core/pipeline）與 src/ 腳本都算 first-party（isort 分組）
target-version = "py312"
extend-exclude = [".venv", "data", "models", "reference", "reports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes（未用變數/import——真 bug 捕手）
    "I",   # isort（import 排序）
    "B",   # bugbear（常見坑）
    "UP",  # pyupgrade（現代語法）
    "RUF", # ruff 自家規則（含 RUF100 unused-noqa——noqa 防線的反向守門）
]
ignore = [
    "E501",   # 行長交給 formatter 管（且表格式註解值得例外）
    "UP006",  # typing.List→list 等：dataclass 欄位型別字串化前後一致性優先
    "UP045",  # Optional[X]→X | None：同上，漸進統一
    "BLE001", # blind-except：操作台/AI 探測的「一個步驟炸不掉整頁」是刻意的
    "S112",   # try-except-continue：TSV 解析的容錯是刻意的（髒列跳過續行）
    "RUF001", # ambiguous-unicode：中文 codebase 的全形標點是正確用法，不是 ambiguous
    "RUF002", # 同上（docstring）
    "RUF003", # 同上（comment）
    "B905",   # zip strict=：3.10+ 語法，此專案 hot path 早已人工核過配對長度
]
# E402 照常檢查：import 放最上面。以前 src/ 與 core/ 要先 sys.path.insert 才能 import，靠 80 個
# `# noqa: E402` 壓制；改成 editable 安裝（見 [tool.hatch.build]）後全數移除。

[tool.ruff.lint.per-file-ignores]
# CLI 相容層：`from core.X import *` 的 re-export 由 __all__ 認列，F401 勿擋
"src/qsdata.py" = ["F401", "F403"]
"src/contractdata.py" = ["F401", "F403"]
"src/labels.py" = ["F401"]
"src/review.py" = ["F401"]
"tests/test_core.py" = ["F401"]       # 測試容許寬鬆 import

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
